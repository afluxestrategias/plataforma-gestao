          <div><span>Gestor direto</span><b>${g ? `<a href="#" data-action="go" data-view="gestores" style="color:var(--accent)">${esc(g.nome)}</a>` : "—"}</b></div>
          <div><span>Admissão</span><b class="num">${fmtData(c.admissao)}</b></div>
          <div><span>Nascimento</span><b class="num">${fmtData(c.nascimento)}</b></div>
          <div><span>Contrato</span><b>${esc(c.contrato || "—")}</b></div>
        </div>
        ${c.observacoes ? `<p style="margin-top:16px;white-space:pre-wrap" class="muted">${esc(c.observacoes)}</p>` : ""}
      </section>
      <div class="grid-2">
        <section class="panel"><header><h2>Perfil DISC</h2>${adm ? `<div class="actions"><button type="button" class="btn sm" data-action="disc-teste" data-id="${esc(c.id)}">Aplicar teste</button><button type="button" class="btn sm" data-action="disc-externo" data-id="${esc(c.id)}">Lançar resultado</button></div>` : ""}</header>
          ${d ? `<div style="margin-bottom:12px"><button type="button" class="btn sm primary" data-action="relatorio" data-id="${esc(d.id)}">Ver relatório comportamental</button></div>
            ${discBars(d)}
            <p style="margin-top:14px"><b class="t-${d.perfil[0]}">${FACTORS[d.perfil[0]].nome}</b>${d.perfil[1] ? ` com traços de <b class="t-${d.perfil[1]}">${FACTORS[d.perfil[1]].nome}</b>` : ""}. ${esc(FACTORS[d.perfil[0]].resumo)}</p>
            <p class="small" style="margin-top:8px"><b>Como liderar:</b> ${esc(FACTORS[d.perfil[0]].liderar)}</p>
            <p class="small muted" style="margin-top:8px">${esc(d.origem)} · <span class="num">${fmtData(d.data)}</span>${adm && d.respostas?.nome ? ` · respondido por ${esc(d.respostas.nome)}${d.respostas.telefone ? " · " + esc(d.respostas.telefone) : ""}` : ""}</p>
            ${discAdaptado(d)}
            ${discs.length > 1 ? `<p class="eyebrow" style="margin-top:14px">Histórico</p><div class="list">${discs.slice(1).map(x => `<div class="list-item"><span class="num small">${fmtData(x.data)}</span>${discChip(x)}<span class="small muted grow num">D ${x.D} · I ${x.I} · S ${x.S} · C ${x.C}</span>${adm ? `<button type="button" class="btn link sm danger" data-action="del-disc" data-id="${esc(x.id)}">Excluir</button>` : ""}</div>`).join("")}</div>` : ""}
            ${adm ? `<div style="margin-top:8px"><button type="button" class="btn link sm danger" data-action="del-disc" data-id="${esc(d.id)}">Excluir resultado atual</button></div>` : ""}`
          : emptyState("Sem teste DISC", adm ? "Gere o link do teste para a pessoa responder ou lance um resultado de outra ferramenta." : "O RH ainda não registrou um teste para esta pessoa.")}
        </section>
        <section class="panel"><header><h2>Avaliações de desempenho</h2><button type="button" class="btn sm" data-action="new-aval" data-id="${esc(c.id)}">Nova avaliação</button></header>
          ${avs.length ? `<div class="list">${avs.map(v => `<div class="list-item"><div class="grow"><b>${esc(v.ciclo)}</b><p class="small muted">${fmtData(v.data)}${v.avaliador ? " · " + esc(v.avaliador) : ""}</p>
              ${v.pdi ? `<p class="small" style="margin-top:4px;white-space:pre-wrap"><b>PDI:</b> ${esc(v.pdi)}</p>` : ""}</div>
              <div style="text-align:right"><span class="small muted">Nota final</span><br><span class="score">${fmtNota(notaFinal(v).nota)}</span><br><span class="pill ${CONCEITO_CLS[notaFinal(v).conceito]}">${CONCEITOS[notaFinal(v).conceito]}</span><br><button type="button" class="btn link sm" data-action="ver-aval" data-id="${esc(v.id)}">Ver</button></div></div>`).join("")}</div>`
          : emptyState("Sem avaliações", "Registre a primeira avaliação para acompanhar a evolução.")}
        </section>
      </div>
      <section class="panel"><header><h2>Feedbacks</h2><button type="button" class="btn sm primary" data-action="new-feedback" data-id="${esc(c.id)}">Registrar feedback</button></header>
        ${fbs.length ? `<div style="display:flex;flex-direction:column;gap:12px">${fbs.map(f => feedbackCard(f, false)).join("")}</div>` : emptyState("Nenhum feedback salvo", "Registre conversas, reconhecimentos e combinados para manter o histórico.")}
      </section>`;
  },

  relatorio() {
    const d = S.disc.find(x => x.id === perfilId), c = d && colab(d.colaborador_id);
    if (!d) return emptyState("Relatório não encontrado", "Volte para a aba Testes DISC e abra o relatório de novo.");
    return `<div class="head no-print"><div><button type="button" class="btn link" data-action="perfil" data-id="${esc(d.colaborador_id)}">← ${esc(c?.nome || "Voltar")}</button></div>
        <div class="actions"><button type="button" class="btn primary" data-action="imprimir">Imprimir / salvar PDF</button></div></div>
      ${relatorioDisc(d, c, esc, Object.fromEntries(S.disc_adjetivos.map(a => [a.palavra, a.fator])))}`;
  },

  disc() {
    const at = ativos();
    const linhas = at.map(c => [c, ultimoDisc(c.id)]).sort((a, b) => !!b[1] - !!a[1] || byNome(a[0], b[0]));
    return `<div class="head"><div><h1>Testes DISC</h1><p>Mapeamento comportamental em quatro fatores.${isAdmin() ? " Gere o link do questionário para a pessoa responder ou lance resultados de outra ferramenta." : " Os testes são aplicados e registrados pelo RH."}</p></div>
        ${isAdmin() ? `<div class="actions"><button type="button" class="btn" data-action="disc-externo">Lançar resultado</button><button type="button" class="btn primary" data-action="disc-teste">Aplicar teste</button></div>` : ""}</div>
      ${seletorSetor()}
      <div class="factor-cards">${"DISC".split("").map(f => `<div class="factor" style="border-top-color:var(--${f.toLowerCase()})">
        <span class="letter t-${f}">${f}</span><h3>${FACTORS[f].nome}</h3><p class="small">${esc(FACTORS[f].resumo)}</p>
        <p class="eyebrow">Forças</p><ul>${FACTORS[f].fortes.map(x => `<li>${x}</li>`).join("")}</ul>
        <p class="eyebrow">Pontos de atenção</p><ul>${FACTORS[f].atencao.map(x => `<li>${x}</li>`).join("")}</ul></div>`).join("")}</div>
      <section class="panel"><header><h2>Resultados da equipe</h2><span class="muted small">Teste mais recente de cada pessoa ativa</span></header>
        ${at.length ? `<div class="table-wrap"><table><thead><tr><th>Colaborador</th><th>Setor</th><th>Perfil</th><th>D</th><th>I</th><th>S</th><th>C</th><th>Data</th>${isAdmin() ? "<th></th>" : ""}</tr></thead><tbody>
          ${linhas.map(([c, d]) => `<tr class="click" data-action="perfil" data-id="${esc(c.id)}"><td><div class="person">${avatar(c)}<div><b>${esc(c.nome)}</b><small>${esc(c.cargo)}</small></div></div></td><td><span class="tag">${esc(SETORES[c.setor])}</span></td>
            <td>${discChip(d)}</td>${"DISC".split("").map(f => `<td class="num ${d && d.perfil.includes(f) ? "t-" + f : "muted"}" style="font-weight:700">${d ? d[f] : "—"}</td>`).join("")}
            <td class="num">${d ? fmtData(d.data) : "—"}</td>${isAdmin() ? `<td>${d ? "" : conviteAberto(c.id) ? `<span class="pill warn">Link enviado</span>` : `<button type="button" class="btn sm" data-action="disc-teste" data-id="${esc(c.id)}">Aplicar</button>`}</td>` : ""}</tr>`).join("")}
          </tbody></table></div>` : emptyState("Nenhum colaborador neste setor", isAdmin() ? "Cadastre a equipe para começar a aplicar os testes." : "Ainda não há colaboradores cadastrados nos seus setores.")}
      </section>
      ${isAdmin() ? linksDisc() : ""}`;
  },

  desempenho() {
    const doEscopo = S.avaliacoes.filter(a => noEscopo(a.colaborador_id));
    const ciclos = [...new Set(doEscopo.map(a => a.ciclo))].sort().reverse();
    const lista = doEscopo.filter(a => !F.ciclo || a.ciclo === F.ciclo).sort(byDataDesc);
    // avaliação mais recente de cada pessoa dentro do filtro, agrupada pelo conceito da nota final
    const ult = {};
    lista.forEach(a => { if (!ult[a.colaborador_id]) ult[a.colaborador_id] = a; });
    const porConceito = Object.fromEntries(Object.keys(CONCEITOS).map(k => [k, []]));
    Object.values(ult).forEach(a => porConceito[notaFinal(a).conceito].push([colab(a.colaborador_id), a]));
    const comp = COMPETENCIAS.map(([n]) => { const v = Object.values(ult).map(a => a.notas?.[n]).filter(Boolean); return [n, v.length ? v.reduce((s, x) => s + x, 0) / v.length : 0]; });
    return `<div class="head"><div><h1>Avaliação de desempenho</h1><p>Notas por competência, análise comportamental e plano de desenvolvimento. A nota final de 0 a 10 é calculada automaticamente.</p></div>
        <div class="actions"><select id="q-ciclo" data-filter="ciclo" aria-label="Filtrar por ciclo" style="width:auto"><option value="">Todos os ciclos</option>${ciclos.map(c => `<option ${F.ciclo === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select><button type="button" class="btn primary" data-action="new-aval">Nova avaliação</button></div></div>
      ${seletorSetor()}
      <div class="grid-2">
        <section class="panel"><header><h2>Equipe por conceito final</h2><span class="muted small num">${Object.keys(ult).length} pessoa(s)</span></header>
          ${Object.keys(ult).length ? `<div class="list">${Object.entries(CONCEITOS).reverse().map(([k, t]) => `<div class="list-item" style="align-items:flex-start">
            <span class="pill ${CONCEITO_CLS[k]}" style="min-width:210px;justify-content:center">${k} – ${t} · ${porConceito[k].length}</span>
            <div class="grow members">${porConceito[k].sort((x, y) => notaFinal(y[1]).nota - notaFinal(x[1]).nota).map(([c, a]) => `<button type="button" class="av" style="--h:${hue(c.id)}" title="${esc(c.nome)} · ${fmtNota(notaFinal(a).nota)}" data-action="perfil" data-id="${esc(c.id)}">${esc(iniciais(c.nome))}</button>`).join("") || `<span class="small muted">Ninguém</span>`}</div></div>`).join("")}</div>
          <p class="small muted" style="margin-top:10px">O conceito final é o nível mais próximo da média geral das duas análises (competências e comportamental). A nota final de 0 a 10 é essa média vezes 2.</p>`
          : emptyState("Sem avaliações no período", "A equipe aparece aqui depois da primeira avaliação.")}
        </section>
        <section class="panel"><header><h2>Média por competência</h2></header>
          ${Object.keys(ult).length ? `<div class="bars">${comp.map(([n, v]) => `<div class="bar-row" style="grid-template-columns:minmax(0,170px) minmax(0,1fr) 34px"><span>${esc(n)}</span><div class="bar-track"><div class="bar-fill" style="width:${v / 5 * 100}%;background:${v < 3 ? "var(--warn)" : "var(--accent)"}"></div></div><span class="num">${fmtNota(v)}</span></div>`).join("")}</div>`
          : emptyState("Sem avaliações no período", "As médias aparecem aqui depois da primeira avaliação.")}
        </section>
      </div>
      ${(() => {
        // distribuição das notas de 1 a 5 por critério, na avaliação mais recente de cada pessoa
        const comAnalise = Object.values(ult).filter(a => a.notas?.comportamental);
        if (!comAnalise.length) return "";
        return `<section class="panel"><header><h2>Análise de desempenho comportamental</h2><span class="muted small num">${comAnalise.length} pessoa(s)</span></header>
          <div class="actions small" style="margin-bottom:8px">${Object.entries(CONCEITOS).map(([k, t]) => `<span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${CONCEITO_COR[k]};margin-right:4px"></span>${k} – ${t}</span>`).join("")}</div>
          ${COMPORTAMENTAIS.map(([n]) => { const notas = comAnalise.map(a => notaComport(a.notas.comportamental[n])).filter(Boolean);
            const q = Object.fromEntries(Object.keys(CONCEITOS).map(k => [k, notas.filter(v => v == k).length]));
            return `<div class="bar-row" style="grid-template-columns:minmax(0,230px) minmax(0,1fr) 90px"><span class="small">${esc(n)}</span>
              <div class="bar-track" style="display:flex">${Object.keys(CONCEITOS).map(k => q[k] ? `<div title="${q[k]} pessoa(s): ${CONCEITOS[k]}" style="width:${q[k] / comAnalise.length * 100}%;background:${CONCEITO_COR[k]}"></div>` : "").join("")}</div>
              <span class="small muted num">${notas.length ? "média " + fmtNota(notas.reduce((s, x) => s + x, 0) / notas.length) : "—"}</span></div>`; }).join("")}
        </section>`;
      })()}
      <section class="panel"><header><h2>Avaliações registradas</h2></header>
        ${lista.length ? `<div class="table-wrap"><table><thead><tr><th>Colaborador</th><th>Ciclo</th><th>Avaliador</th><th>Data</th><th>Média</th><th>Nota final</th><th></th></tr></thead><tbody>
          ${lista.map(a => { const c = colab(a.colaborador_id); return `<tr><td><div class="person">${avatar(c)}<div><b>${esc(nomeDe(a.colaborador_id))}</b><small>${esc(c?.cargo)}</small></div></div></td><td>${esc(a.ciclo)}</td><td>${esc(a.avaliador || "—")}</td><td class="num">${fmtData(a.data)}</td>
            <td><span class="score">${fmtNota(a.media)}</span> ${dots(a.media)}</td><td style="white-space:nowrap">${notaFinalChip(a)}</td>
            <td style="white-space:nowrap"><button type="button" class="btn link sm" data-action="ver-aval" data-id="${esc(a.id)}">Ver</button>${meus(a) ? `<button type="button" class="btn link sm" data-action="edit-aval" data-id="${esc(a.id)}">Editar</button><button type="button" class="btn link sm danger" data-action="del-aval" data-id="${esc(a.id)}">Excluir</button>` : ""}</td></tr>`; }).join("")}
          </tbody></table></div>` : emptyState("Nenhuma avaliação registrada", "Avalie as competências de 1 a 5, a análise comportamental e registre o PDI.", `<button type="button" class="btn sm primary" data-action="new-aval">Nova avaliação</button>`)}
      </section>`;
  },

  gestores() {
    const adm = isAdmin();
    const lista = [...S.gestores].sort(byNome);
    const sem = ativos().filter(c => !gestor(c.lider_id)).sort(byNome);
    const pessoaRow = c => `<div class="list-item" data-action="perfil" data-id="${esc(c.id)}" style="cursor:pointer;padding:8px 0"><div class="grow person">${avatar(c)}<div><b>${esc(c.nome)}</b><small>${esc(c.cargo)}</small></div></div><span class="tag">${esc(SETORES[c.setor])}</span></div>`;
    const gestorRow = x => `<div class="list-item" style="padding:8px 0"><div class="grow person">${avatar(x)}<div><b>${esc(x.nome)}</b><small>${esc(x.cargo || "Gestor")}</small></div></div><span class="tag">Gestor</span></div>`;
    return `<div class="head"><div><h1>Gestores</h1><p>Quem lidera quem. Cada colaborador tem um gestor direto, e um gestor pode responder a outro gestor.</p></div>
        ${adm ? `<div class="actions"><button type="button" class="btn primary" data-action="new-gestor">Novo gestor</button></div>` : ""}</div>
      ${seletorSetor()}
      ${lista.length ? `<div class="areas">${lista.map(g => { const m = liderados(g.id).filter(c => !F.setor || c.setor === F.setor), subs = subGestores(g.id), sup = gestor(g.superior_id);
        return `<article class="area"><header><div class="person">${avatar(g, "")}<div><h3>${esc(g.nome)}</h3><small>${esc(g.cargo || "Gestor")}${sup ? " · responde a " + esc(sup.nome) : ""}</small></div></div><span class="pill plain num" title="Liderados diretos">${subs.length + m.length}</span></header>
          ${g.observacoes ? `<p class="small muted">${esc(g.observacoes)}</p>` : ""}
          <div class="list">${subs.map(gestorRow).join("")}${m.map(pessoaRow).join("") || (subs.length ? "" : `<p class="small muted">Nenhum liderado${F.setor ? " neste setor" : " definido"}.</p>`)}</div>
          ${adm ? `<div class="actions"><button type="button" class="btn sm primary" data-action="liderados" data-id="${esc(g.id)}">Definir liderados</button><button type="button" class="btn sm" data-action="edit-gestor" data-id="${esc(g.id)}">Editar</button><button type="button" class="btn sm danger" data-action="del-gestor" data-id="${esc(g.id)}">Excluir</button></div>` : ""}
        </article>`; }).join("")}</div>`
        : `<section class="panel">${emptyState("Nenhum gestor cadastrado", adm ? "Cadastre os gestores e depois marque os liderados diretos de cada um." : "O RH ainda não cadastrou os gestores.", adm ? `<button type="button" class="btn sm primary" data-action="new-gestor">Novo gestor</button>` : "")}</section>`}
      ${sem.length ? `<section class="panel"><header><h2>Sem gestor definido</h2><span class="pill plain num">${sem.length}</span></header><div class="list">${sem.map(pessoaRow).join("")}</div></section>` : ""}`;
  },

  feedbacks() {
    return `<div class="head"><div><h1>Feedbacks</h1><p>Histórico de conversas, reconhecimentos e combinados com cada colaborador.</p></div>
        <div class="actions"><button type="button" class="btn primary" data-action="new-feedback">Registrar feedback</button></div></div>
      ${seletorSetor()}
      <div class="toolbar">
        <select id="q-fbcolab" data-filter="fbColab" aria-label="Filtrar por colaborador"><option value="">Todos os colaboradores</option>${colabOptions(F.fbColab, false)}</select>
        <select id="q-fbtipo" data-filter="fbTipo" aria-label="Filtrar por tipo"><option value="">Todos os tipos</option>${TIPOS_FB.map(t => `<option ${F.fbTipo === t ? "selected" : ""}>${t}</option>`).join("")}</select>
      </div>
      <div id="lista"></div>`;
  },

  cargos() {
    if (!isAdmin()) return emptyState("Acesso restrito", "Somente a administradora vê o plano de cargos e salários.");
    const pessoasAt = ativos().sort(byNome);
    const linhas = pessoasAt.map(c => { const r = remunDe(c.id); return { c, r, cg: r && cargoPlano(r.cargo_id), e: enquadramento(r) }; });
    const folha = linhas.reduce((s, l) => s + (l.r?.salario_atual || 0), 0);
    const abaixo = linhas.filter(l => l.e.sit === "abaixo");
    const ajuste = abaixo.reduce((s, l) => s - l.e.dif, 0);
    const pendentes = linhas.filter(l => ["sem-cargo", "sem-salario", "sem-faixa"].includes(l.e.sit)).length;
    const ocup = id => linhas.filter(l => l.r?.cargo_id === id).length;
    const cargos = [...S.cargos_plano].filter(cg => !F.setor || !cg.setor || cg.setor === F.setor)
      .sort((a, b) => byNome(a, b) || (a.nivel || "").localeCompare(b.nivel || ""));
    return `<div class="head"><div><h1>Cargos e salários</h1><p>Plano de cargos com a faixa salarial prevista e o enquadramento de cada colaborador. Só você vê esta aba.</p></div>
        <div class="actions"><button type="button" class="btn primary" data-action="new-cargo">Novo cargo</button></div></div>
      ${seletorSetor()}
      <div class="kpis">
        <div class="kpi"><span>Folha atual</span><b class="num" style="font-size:1.35rem">${brl(folha)}</b><span>soma dos salários informados</span></div>
        <div class="kpi"><span>Abaixo do plano</span><b>${abaixo.length}</b><span>${abaixo.length ? brl(ajuste) + " por mês para enquadrar" : "ninguém abaixo do piso"}</span></div>
        <div class="kpi"><span>Dentro do plano</span><b>${linhas.filter(l => l.e.sit === "dentro").length}</b><span>de ${linhas.length} pessoas</span></div>
        <div class="kpi"><span>Pendências</span><b>${pendentes}</b><span>sem cargo, salário ou valor no plano</span></div>
      </div>
      <section class="panel"><header><h2>Plano de cargos</h2><span class="muted small">${S.cargos_plano.length} cargo(s)</span></header>
        ${cargos.length ? `<div class="table-wrap"><table><thead><tr><th>Cargo</th><th>Nível</th><th>Setor</th><th>Salário previsto</th><th>Pessoas</th><th></th></tr></thead><tbody>
          ${cargos.map(cg => `<tr><td><b>${esc(cg.nome)}</b>${cg.requisitos ? `<br><small class="muted">${esc(cg.requisitos)}</small>` : ""}</td><td>${esc(cg.nivel || "—")}</td>
            <td>${cg.setor ? `<span class="tag">${esc(SETORES[cg.setor])}</span>` : `<span class="small muted">Qualquer</span>`}</td>
            <td class="num">${cg.salario_min == null ? `<span class="small" style="color:var(--warn)">Definir valor</span>` : esc(faixaTxt(cg))}</td><td class="num">${ocup(cg.id)}</td>
            <td><div class="actions"><button type="button" class="btn sm" data-action="edit-cargo" data-id="${esc(cg.id)}">Editar</button><button type="button" class="btn sm danger" data-action="del-cargo" data-id="${esc(cg.id)}">Excluir</button></div></td></tr>`).join("")}
          </tbody></table></div>` : emptyState("Nenhum cargo no plano", "Cadastre os cargos com o salário previsto de cada um.", `<button type="button" class="btn sm primary" data-action="new-cargo">Novo cargo</button>`)}
      </section>
      <section class="panel"><header><h2>Enquadramento por colaborador</h2><span class="muted small">Salário previsto x salário atual</span></header>
        ${linhas.length ? `<div class="table-wrap"><table><thead><tr><th>Colaborador</th><th>Cargo no plano</th><th>Salário previsto</th><th>Salário atual</th><th>Diferença</th><th>Situação</th><th></th></tr></thead><tbody>
          ${linhas.map(({ c, r, cg, e }) => `<tr><td><div class="person">${avatar(c)}<div><b>${esc(c.nome)}</b><small>${esc(SETORES[c.setor])}</small></div></div></td>
            <td>${cg ? esc(cg.nome) + (cg.nivel ? ` <small class="muted">· ${esc(cg.nivel)}</small>` : "") : `<span class="small muted">—</span>`}</td>
            <td class="num">${cg ? esc(faixaTxt(cg)) : "—"}</td><td class="num"><b>${brl(r?.salario_atual)}</b></td>
            <td class="num" style="font-weight:700;color:${e.dif < 0 ? "var(--bad)" : e.dif > 0 ? "var(--warn)" : "inherit"}">${e.dif == null ? "—" : e.dif === 0 ? "—" : (e.dif > 0 ? "+" : "−") + brl(Math.abs(e.dif))}</td>
            <td><span class="pill ${e.cls}">${e.txt}</span></td>
            <td><button type="button" class="btn sm" data-action="edit-remun" data-id="${esc(c.id)}">Editar</button></td></tr>`).join("")}
          </tbody></table></div>` : emptyState("Nenhum colaborador ativo", "Cadastre a equipe na aba Colaboradores.")}
        <p class="small muted" style="margin-top:10px">Diferença em vermelho: quanto falta para o salário chegar ao piso do cargo. Em amarelo: quanto o salário está acima do teto.</p>
      </section>`;
  },

  usuarios() {
    if (!isAdmin()) return emptyState("Acesso restrito", "Somente administradores gerenciam usuários.");
    const l = [...S.perfis].sort(byNome);
    return `<div class="head"><div><h1>Usuários e acessos</h1><p>Crie o login dos gestores e marque quais setores cada um pode visualizar. Gestores registram avaliações e feedbacks, mas não cadastram colaboradores nem testes DISC.</p></div>
        <div class="actions"><button type="button" class="btn primary" data-action="new-user">Novo usuário</button></div></div>
      <section class="panel">
        ${l.length ? `<div class="table-wrap"><table><thead><tr><th>Usuário</th><th>Perfil</th><th>Setores visíveis</th><th>Situação</th><th></th></tr></thead><tbody>
          ${l.map(u => `<tr><td><div class="person">${avatar(u)}<div><b>${esc(u.nome || "—")}${u.id === me.id ? " (você)" : ""}</b><small>${esc(u.email)}</small></div></div></td>
            <td>${u.papel === "admin" ? `<span class="pill plain">Administrador</span>` : `<span class="pill plain">Gestor</span>`}</td>
            <td>${u.papel === "admin" ? `<span class="small muted">Todos</span>` : (u.setores || []).length ? `<div class="actions">${u.setores.map(k => `<span class="tag">${SETORES[k]}</span>`).join("")}</div>` : `<span class="small" style="color:var(--bad)">Nenhum</span>`}</td>
            <td>${u.ativo ? `<span class="pill ok">Liberado</span>` : `<span class="pill bad">Bloqueado</span>`}</td>
            <td><button type="button" class="btn sm" data-action="edit-user" data-id="${esc(u.id)}">Editar acesso</button></td></tr>`).join("")}
          </tbody></table></div>` : emptyState("Nenhum usuário", "Crie o primeiro login de gestor.")}
      </section>
      <p class="small muted">Para redefinir a senha de um gestor que esqueceu, use o painel do Supabase (Authentication › Users). Para tirar o acesso de alguém, mude a situação para “Acesso bloqueado”.</p>`;
  },
};

const LISTAS = {
  colaboradores() {
    const q = F.busca.trim().toLowerCase();
    const base = pessoas();
    const l = [...base].sort(byNome).filter(c =>
      (!q || [c.nome, c.cargo, c.matricula].some(v => (v || "").toLowerCase().includes(q))) && (!F.status || (c.status || "Ativo") === F.status));
    if (!base.length) return emptyState("Nenhum colaborador neste setor", isAdmin() ? "Cadastre a equipe. Depois aplique o DISC, registre avaliações e feedbacks na ficha de cada pessoa." : "Ainda não há colaboradores cadastrados nos seus setores.", isAdmin() ? `<button type="button" class="btn sm primary" data-action="new-colab">Novo colaborador</button>` : "");
    if (!l.length) return emptyState("Nenhum resultado", "Ajuste a busca ou os filtros.");
    return `<div class="table-wrap"><table><thead><tr><th>Colaborador</th><th>Setor</th><th>Gestor</th><th>Admissão</th><th>DISC</th><th>Última nota</th><th>Situação</th></tr></thead><tbody>
      ${l.map(c => { const av = ultimaAval(c.id); return `<tr class="click" data-action="perfil" data-id="${esc(c.id)}">
        <td><div class="person">${avatar(c)}<div><b>${esc(c.nome)}</b><small>${esc(c.cargo)}</small></div></div></td>
        <td><span class="tag">${esc(SETORES[c.setor])}</span></td><td>${esc(gestor(c.lider_id)?.nome || "—")}</td><td class="num">${fmtData(c.admissao)}</td>
        <td>${discChip(ultimoDisc(c.id))}</td><td>${av ? `<span class="score">${fmtNota(notaFinal(av).nota)}</span>` : `<span class="muted">—</span>`}</td><td>${statusPill(c.status)}</td></tr>`; }).join("")}
      </tbody></table></div><p class="small muted" style="margin-top:10px">${l.length} de ${base.length} colaborador(es)</p>`;
  },
  feedbacks() {
    const base = S.feedbacks.filter(f => noEscopo(f.colaborador_id));
    const l = base.filter(f => (!F.fbColab || f.colaborador_id === F.fbColab) && (!F.fbTipo || f.tipo === F.fbTipo)).sort(byDataDesc);
    if (!base.length) return `<section class="panel">${emptyState("Nenhum feedback salvo", "Registre o primeiro feedback para começar o histórico.", `<button type="button" class="btn sm primary" data-action="new-feedback">Registrar feedback</button>`)}</section>`;
    if (!l.length) return `<section class="panel">${emptyState("Nenhum feedback com esses filtros", "Ajuste o colaborador ou o tipo.")}</section>`;
    return `<div style="display:flex;flex-direction:column;gap:12px">${l.map(f => feedbackCard(f)).join("")}</div>`;
  },
};

function renderLista() {
  const el = document.getElementById("lista");
  if (el && LISTAS[view]) el.innerHTML = LISTAS[view]();
}
function render() {
  if (!me) return;
  const aba = view === "perfil" ? "colaboradores" : view === "relatorio" ? "disc" : view;
  document.querySelectorAll("#tabs .tab").forEach(t => t.dataset.view === aba ? t.setAttribute("aria-current", "page") : t.removeAttribute("aria-current"));
  const v = document.getElementById("view");
  if (!carregado) { v.innerHTML = `<div class="empty"><b>Carregando dados…</b><span>Buscando colaboradores, testes e avaliações.</span></div>`; return; }
  const ativo = document.activeElement?.id, pos = document.activeElement?.selectionStart;
  v.innerHTML = VIEWS[view]();
  renderLista();
  if (ativo && ativo.startsWith("q-")) { const el = document.getElementById(ativo); if (el) { el.focus(); if (pos != null && el.setSelectionRange) try { el.setSelectionRange(pos, pos); } catch (e) {} } }
}
function go(v, id) {
  view = v; perfilId = id || null;
  try { history.replaceState(null, "", v === "perfil" || v === "relatorio" ? location.pathname : "#" + v); } catch (e) {}
  render(); window.scrollTo(0, 0);
}

/* ---------- ações ---------- */
// Quadro da análise comportamental (E/S/R/I) de uma avaliação; vazio para avaliações antigas sem ela
function resumoComportamental(a) {
  const c = a.notas?.comportamental;
  if (!c) return "";
  const cont = Object.keys(CONCEITOS).reverse().map(k => [k, Object.values(c).filter(v => notaComport(v) == k).length]).filter(([, q]) => q);
  return `<div><h3 class="sec-titulo">Análise de Desempenho Comportamental</h3>
    <div class="actions" style="margin-bottom:6px">${cont.map(([k, q]) => `<span class="pill ${CONCEITO_CLS[k]}">${q} ${CONCEITOS[k]}</span>`).join("")}</div>
    ${COMPORTAMENTAIS.map(([n]) => { const v = notaComport(c[n]); return `<div class="comp-row"><span>${esc(n)}</span><span class="pill ${CONCEITO_CLS[v] || "plain"}">${v ? v + " – " + CONCEITOS[v] : "—"}</span></div>`; }).join("")}</div>`;
}

function verAvaliacao(a) {
  openModal({
    title: `${nomeDe(a.colaborador_id)} · ${a.ciclo}`, submit: meus(a) ? "Editar" : "",
    body: `<p class="muted small">${fmtData(a.data)}${a.avaliador ? " · avaliado por " + esc(a.avaliador) : ""}</p>
      ${(() => { const f = notaFinal(a); return `<div class="kpi" style="text-align:center"><span>Nota final</span><b>${fmtNota(f.nota)}</b>
        <span><span class="pill ${CONCEITO_CLS[f.conceito]}">${CONCEITOS[f.conceito]}</span></span>
        <span class="small muted">Média das competências ${fmtNota(f.comp)}${f.comport != null ? " · média comportamental " + fmtNota(f.comport) : ""} (de 1 a 5)</span></div>`; })()}
      <div><h3 class="sec-titulo">Análise de Competências</h3>${COMPETENCIAS.map(([n]) => `<div class="comp-row"><b>${esc(n)}</b><span><span class="score">${a.notas?.[n] ?? "—"}</span> ${dots(a.notas?.[n] || 0)}</span></div>`).join("")}
      <div class="comp-row"><b>Média das competências</b><span class="score" style="font-size:1.2rem">${fmtNota(a.media)}</span></div></div>
      ${resumoComportamental(a)}
      ${a.pontos_fortes ? `<div><p class="lbl">Pontos fortes</p><p style="white-space:pre-wrap">${esc(a.pontos_fortes)}</p></div>` : ""}
      ${a.desenvolver ? `<div><p class="lbl">Pontos a desenvolver</p><p style="white-space:pre-wrap">${esc(a.desenvolver)}</p></div>` : ""}
      ${a.pdi ? `<div><p class="lbl">PDI e metas</p><p style="white-space:pre-wrap">${esc(a.pdi)}</p></div>` : ""}`,
    handler: () => { setTimeout(() => formAvaliacao(a), 0); }
  });
}
const ACTIONS = {
  "go": d => go(d.view),
  "perfil": d => go("perfil", d.id),
  "setor": d => { F.setor = d.setor; F.fbColab = ""; render(); },
  "close-modal": () => closeModal(),
  "sair": async () => { await sb?.auth.signOut(); tela("telaLogin"); },
  "minha-senha": () => formMinhaSenha(),
  "new-colab": () => formColaborador(),
  "edit-colab": d => formColaborador(colab(d.id)),
  "del-colab": d => {
    const c = colab(d.id);
    const n = ["disc", "avaliacoes", "feedbacks"].reduce((s, t) => s + S[t].filter(x => x.colaborador_id === c.id).length, 0);
    confirmar("Excluir colaborador", `<p>Excluir <b>${esc(c.nome)}</b>${n ? ` e os ${n} registro(s) ligados a essa pessoa (testes DISC, avaliações e feedbacks)` : ""}? Isso não pode ser desfeito.</p><p class="small muted">Se a pessoa saiu da empresa, você pode só mudar a situação para “Desligado” e manter o histórico.</p>`,
      "Excluir definitivamente", async () => { if (!await remove("colaboradores", c.id)) return false; toast("Colaborador excluído"); go("colaboradores"); return true; });
  },
  "new-gestor": () => formGestor(),
  "edit-gestor": d => formGestor(gestor(d.id)),
  "liderados": d => formLiderados(gestor(d.id)),
  "del-gestor": d => {
    const g = gestor(d.id), n = liderados(g.id).length + subGestores(g.id).length;
    confirmar("Excluir gestor", `<p>Excluir <b>${esc(g.nome)}</b> da lista de gestores?${n ? ` Os ${n} liderado(s) ficam sem gestor definido.` : ""} Os colaboradores não são apagados.</p>`,
      "Excluir", async () => { if (!await remove("gestores", g.id)) return false; toast("Gestor excluído"); return true; });
  },
  "edit-setor": d => formSetor(S.setores.find(s => s.codigo === d.id) || { codigo: d.id }),
  "disc-teste": d => formDiscLink(d.id),
  "ver-link": d => mostrarLinkDisc(S.disc_convites.find(v => v.id === d.id)),
  "cancelar-link": d => {
    const v = S.disc_convites.find(x => x.id === d.id);
    confirmar("Cancelar link", `<p>Cancelar o link do teste de <b>${esc(nomeDe(v.colaborador_id))}</b>? Se a pessoa abrir o link depois, verá que ele não vale mais.</p>`,
      "Cancelar link", async () => { if (!await remove("disc_convites", v.id)) return false; toast("Link cancelado"); return true; });
  },
  "atualizar-disc": async () => { await carregar(["disc", "disc_convites"]); toast("Lista atualizada"); },
  "copiar": async d => {
    try { await navigator.clipboard.writeText(d.texto); toast("Copiado"); }
    catch (e) {
      // navegador sem acesso à área de transferência: copia por um campo temporário
      const t = document.createElement("textarea"); t.value = d.texto; (modal.open ? modal : document.body).append(t); t.select();
      const ok = document.execCommand("copy"); t.remove();
      toast(ok ? "Copiado" : "Não foi possível copiar. Use “Ver link” e copie com Ctrl+C.", !ok);
    }
  },
  "disc-externo": d => formDiscExterno(d.id),
  "del-disc": d => confirmar("Excluir resultado DISC", `<p>Excluir este resultado de teste? Isso não pode ser desfeito.</p>`, "Excluir",
      async () => { if (!await remove("disc", d.id)) return false; toast("Resultado excluído"); return true; }),
  "new-aval": d => formAvaliacao({}, d.id),
  "edit-aval": d => formAvaliacao(S.avaliacoes.find(a => a.id === d.id)),
  "ver-aval": d => verAvaliacao(S.avaliacoes.find(a => a.id === d.id)),
  "relatorio": d => go("relatorio", d.id),
  "imprimir": () => window.print(),
  "del-aval": d => confirmar("Excluir avaliação", `<p>Excluir esta avaliação de desempenho? Isso não pode ser desfeito.</p>`, "Excluir",
      async () => { if (!await remove("avaliacoes", d.id)) return false; toast("Avaliação excluída"); return true; }),
  "new-feedback": d => formFeedback({}, d.id),
  "edit-feedback": d => formFeedback(S.feedbacks.find(f => f.id === d.id)),
  "del-feedback": d => confirmar("Excluir feedback", `<p>Excluir este feedback do histórico? Isso não pode ser desfeito.</p>`, "Excluir",
      async () => { if (!await remove("feedbacks", d.id)) return false; toast("Feedback excluído"); return true; }),
  "new-user": () => formUsuario(),
  "edit-user": d => formUsuario(S.perfis.find(u => u.id === d.id)),
  "new-cargo": () => formCargo(),
  "edit-cargo": d => formCargo(cargoPlano(d.id)),
  "edit-remun": d => formRemuneracao(d.id),
  "del-cargo": d => {
    const cg = cargoPlano(d.id), n = S.remuneracao.filter(r => r.cargo_id === cg.id).length;
    confirmar("Excluir cargo", `<p>Excluir <b>${esc(cg.nome)}</b> do plano?${n ? ` As ${n} pessoa(s) neste cargo ficam sem cargo no plano, mas o salário atual delas é mantido.` : ""}</p>`,
      "Excluir", async () => { if (!await remove("cargos_plano", cg.id)) return false; await carregar(["remuneracao"]); toast("Cargo excluído"); return true; });
  },
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el || !ACTIONS[el.dataset.action]) return;
  if (el.tagName === "A") e.preventDefault();
  ACTIONS[el.dataset.action](el.dataset, el);
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".node[data-action]")) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("input", e => {
  const k = e.target.dataset?.filter; if (!k) return;
  F[k] = e.target.value;
  if (LISTAS[view]) renderLista(); else render();
});

iniciar();
</script>
</body>
</html>
