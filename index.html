<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AFLUX · Gente &amp; Gestão</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
:root {
  color-scheme: light;
  /* cores da marca AFLUX: azul-marinho #27306A, rosa #C44E60, lilás #A486A2 */
  --bg: #F4F4F9; --surface: #FFFFFF; --surface-2: #ECEDF4; --ink: #1B1F45; --muted: #5E6185; --line: #DCDDEA;
  --accent: #27306A; --accent-ink: #FFFFFF; --accent-soft: #E7E8F3;
  --brand-grad: linear-gradient(90deg, #C44E60, #A486A2);
  --d: #D04545; --i: #D99A0B; --s: #3A9657; --c: #2E6CB5;
  --good: #2E8B57; --warn: #B7791F; --bad: #C0392B; --av-l: 42%;
  --display: "Sora", "Segoe UI", system-ui, sans-serif;
  --body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #10122A; --surface: #181B3A; --surface-2: #222547; --ink: #E9EAF5; --muted: #A2A5C6; --line: #2E3260;
  --accent: #A9B1F0; --accent-ink: #141838; --accent-soft: #2A2F63;
  --d: #F07070; --i: #F2C04A; --s: #6CC489; --c: #6FA6EC;
  --good: #5CC98A; --warn: #E8B04F; --bad: #F07A6E; --av-l: 36%; color-scheme: dark } }

* { box-sizing: border-box }
html, body { margin: 0 }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5 }
[hidden] { display: none !important }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -0.01em }
h1 { font-size: 1.6rem; font-weight: 700 }
h2 { font-size: 1.12rem; font-weight: 600 }
h3 { font-size: 0.98rem; font-weight: 600 }
p { margin: 0 }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.num { font-variant-numeric: tabular-nums }
.muted { color: var(--muted) }
.small { font-size: 0.85rem }
.eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700 }

/* login */
.login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px }
.login-box { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 16px }
.login-box .brand { padding: 0 }

.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 22px 14px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 22px }
.brand { display: flex; flex-direction: column; gap: 8px; padding: 0 8px }
/* o logo é azul-marinho sobre transparente: no tema escuro ganha um fundo claro para continuar legível */
.brand-logo { display: block; width: 150px; max-width: 100%; height: auto; border-radius: 8px }
.brand small { color: var(--muted); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase }
.grad-bar { height: 4px; border-radius: 99px; background: var(--brand-grad) }
@media (prefers-color-scheme: dark) { .brand-logo { background: #FFFFFF; padding: 6px 8px } }
nav.tabs { display: flex; flex-direction: column; gap: 2px }
.tab { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; border: 0; background: none; cursor: pointer; text-align: left; color: var(--muted); font-weight: 600 }
.tab svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.tab:hover { background: var(--surface-2); color: var(--ink) }
.tab[aria-current="page"] { background: var(--accent-soft); color: var(--accent) }
.side-foot { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem }
.side-foot b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.side-foot .who { display: flex; flex-direction: column; min-width: 0 }

main { padding: 28px 16px 64px; min-width: 0 }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px }
.head p { color: var(--muted); max-width: 62ch; margin-top: 4px }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 15px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; font-size: 0.9rem; white-space: nowrap }
.btn:hover { border-color: var(--accent) }
.btn:disabled { opacity: .6; cursor: wait }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.primary:hover { filter: brightness(1.08) }
.btn.danger { color: var(--bad) }
.btn.danger.solid { background: var(--bad); color: #fff; border-color: var(--bad) }
.btn.sm { padding: 5px 10px; font-size: 0.82rem }
.btn.link { border: 0; background: none; padding: 4px 6px; color: var(--accent) }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; min-width: 0 }
.panel > header { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 4px }
.kpi b { font-family: var(--display); font-size: 1.75rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2 }
.kpi span { color: var(--muted); font-size: 0.85rem }

.scope { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; font-weight: 700; font-size: 0.82rem; cursor: pointer; color: var(--muted) }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.tag { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 0.76rem; font-weight: 700; background: var(--surface-2); color: var(--muted); white-space: nowrap }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0 }
.field label, .lbl { font-size: 0.8rem; font-weight: 700; color: var(--muted) }
input[type="text"], input[type="email"], input[type="tel"], input[type="date"], input[type="number"], input[type="search"], input[type="password"], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; width: 100%; min-width: 0 }
input[readonly] { background: var(--surface-2) }
textarea { min-height: 84px; resize: vertical }
.toolbar input[type="search"] { width: 260px; max-width: 100% }
.toolbar select { width: auto; max-width: 100% }
.checks { display: flex; flex-wrap: wrap; gap: 8px 16px }
.checks label { display: flex; gap: 6px; align-items: center; font-weight: 600; color: var(--ink); font-size: 0.92rem; cursor: pointer }
.checks input { width: 17px; height: 17px; accent-color: var(--accent) }

.table-wrap { overflow-x: auto; margin: 0 -20px; padding: 0 20px }
table { width: 100%; border-collapse: collapse; font-size: 0.92rem }
th { text-align: left; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle }
tr.click { cursor: pointer }
tr.click:hover td { background: var(--surface-2) }

.person { display: flex; align-items: center; gap: 10px; min-width: 0 }
.person > div { min-width: 0 }
.person b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.person small { color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.av { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 0.8rem; color: #fff; background: hsl(var(--h, 170) 45% var(--av-l)); font-family: var(--display) }
.av.lg { width: 64px; height: 64px; font-size: 1.3rem }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: 0.78rem; font-weight: 700; background: var(--surface-2); color: var(--muted); white-space: nowrap }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor }
.pill.ok { color: var(--good) } .pill.warn { color: var(--warn) } .pill.bad { color: var(--bad) }
.pill.plain::before { display: none }

.disc-chip { display: inline-flex; border-radius: 6px; overflow: hidden; font-weight: 700; font-size: 0.78rem; font-family: var(--display) }
.disc-chip span { padding: 2px 7px; color: #fff }
.f-D { background: var(--d) } .f-I { background: var(--i) } .f-S { background: var(--s) } .f-C { background: var(--c) }
.t-D { color: var(--d) } .t-I { color: var(--i) } .t-S { color: var(--s) } .t-C { color: var(--c) }

.bars { display: flex; flex-direction: column; gap: 8px }
.bar-row { display: grid; grid-template-columns: 112px minmax(0, 1fr) 38px; gap: 10px; align-items: center; font-size: 0.86rem }
.bar-track { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden }
.bar-fill { height: 100%; border-radius: 99px }
.bar-row .num { text-align: right; font-weight: 700 }

.stack { display: flex; height: 26px; border-radius: 6px; overflow: hidden; background: var(--surface-2) }
.stack div { display: grid; place-items: center; color: #fff; font-size: 0.78rem; font-weight: 700; min-width: 0 }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 0.85rem }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px }

.list { display: flex; flex-direction: column }
.list-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: flex-start }
.list-item:last-child { border-bottom: 0 }
.list-item > .grow { flex: 1; min-width: 0 }
.empty { padding: 26px 12px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center }
.empty b { color: var(--ink); font-family: var(--display); font-weight: 600 }

.fb { border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; background: var(--surface) }
.fb .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 0.84rem; color: var(--muted) }
.fb .txt { white-space: pre-wrap }
.fb .plan { background: var(--surface-2); border-radius: 8px; padding: 8px 12px; font-size: 0.9rem; white-space: pre-wrap }
.tipo-Reconhecimento { color: var(--good) } .tipo-Construtivo { color: var(--warn) } .tipo-Reunião { color: var(--c) } .tipo-Alinhamento { color: var(--accent) }

.profile-head { display: flex; gap: 18px; align-items: center; flex-wrap: wrap }
.profile-head .grow { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 4px }
.info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px 20px }
.info-grid div span { display: block; font-size: 0.76rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em }
.info-grid div b { font-weight: 600; overflow-wrap: anywhere }

.factor-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px }
.factor { border-radius: var(--r); padding: 16px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 6px; border-top: 4px solid }
.factor .letter { font-family: var(--display); font-size: 1.9rem; font-weight: 700; line-height: 1 }
.factor ul { margin: 0; padding-left: 18px; font-size: 0.86rem; color: var(--muted) }

.members .av { width: 28px; height: 28px; font-size: 0.68rem; cursor: pointer; border: 0 }

.score { font-family: var(--display); font-weight: 600; font-variant-numeric: tabular-nums }
.dots { display: inline-flex; gap: 3px; vertical-align: middle }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line) }
.dots i.on { background: var(--accent) }

.areas { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px }
.area { border: 1px solid var(--line); border-radius: var(--r); padding: 16px; background: var(--surface); display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.area header { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start }
.area .members { display: flex; flex-wrap: wrap; gap: 4px }
.tree, .tree ul { list-style: none; margin: 0; padding: 0 }
.tree ul { padding-left: 26px; border-left: 1px dashed var(--line); margin-left: 16px }
.tree li { padding: 5px 0 }
.tree .node { display: inline-flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); cursor: pointer; max-width: 100% }
.tree .node:hover { border-color: var(--accent) }
.tree .node .av { width: 28px; height: 28px; font-size: 0.68rem }
.tree .node small { color: var(--muted) }

dialog { border: 0; border-radius: 14px; padding: 0; width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 40px); background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,0.3) }
dialog::backdrop { background: rgba(10, 20, 19, 0.5) }
dialog form { display: flex; flex-direction: column; max-height: calc(100vh - 40px) }
.m-head { padding: 18px 22px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px }
.m-body { padding: 18px 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px }
.m-foot { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px }
.form-grid .full { grid-column: 1 / -1 }
.req::after { content: " *"; color: var(--bad) }
.form-err { color: var(--bad); font-weight: 700; font-size: 0.88rem }

.q-group { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden }
.q-group.missing { border-color: var(--bad) }
.q-group table td, .q-group table th { padding: 6px 12px }
.q-group th:not(:first-child), .q-group td:not(:first-child) { text-align: center; width: 76px }
.q-group input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer }
.q-group caption { text-align: left; padding: 8px 12px; background: var(--surface-2); font-size: 0.8rem; font-weight: 700; color: var(--muted) }

.sec-titulo { font-family: var(--display); font-size: 1.5rem; font-weight: 700; color: var(--accent); margin: 18px 0 4px; padding-bottom: 8px; border-bottom: 3px solid transparent; border-image: var(--brand-grad) 1 }
.comp-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line) }
.comp-row small { display: block; color: var(--muted) }
.scale { display: flex; gap: 4px }
.scale label { position: relative }
.scale input { position: absolute; opacity: 0; pointer-events: none }
.scale span { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; font-weight: 700; font-variant-numeric: tabular-nums }
.scale input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.scale input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px }

#toast { position: fixed; right: 16px; bottom: 16px; background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 10px; font-weight: 600; font-size: 0.9rem; max-width: min(420px, calc(100vw - 32px)); z-index: 50 }
#toast.err { background: var(--bad); color: #fff }

@media (max-width: 1020px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)) } .factor-cards { grid-template-columns: repeat(2, minmax(0, 1fr)) } .grid-3 { grid-template-columns: minmax(0, 1fr) } }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr) }
  .side { height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 16px; border-right: 0; border-bottom: 1px solid var(--line); z-index: 5; gap: 10px }
  .brand { padding: 0 } .brand small, .brand .grad-bar { display: none } .brand-logo { width: 90px }
  nav.tabs { flex-direction: row; overflow-x: auto; min-width: 0; flex: 1 }
  .tab { padding: 8px 10px; white-space: nowrap } .tab svg { display: none }
  .side-foot { margin-top: 0; border-top: 0; padding: 0; flex-direction: row; align-items: center; width: 100% }
  .side-foot .who { display: none }
  .grid-2 { grid-template-columns: minmax(0, 1fr) }
}
@media (max-width: 560px) {
  .kpis, .factor-cards, .form-grid { grid-template-columns: minmax(0, 1fr) }
  .comp-row { grid-template-columns: minmax(0, 1fr) }
  .bar-row { grid-template-columns: 84px minmax(0, 1fr) 34px }
}
/* relatório comportamental */
.relatorio { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 28px; display: flex; flex-direction: column; gap: 22px; max-width: 900px }
.rel-capa { display: flex; gap: 20px; align-items: center; padding-bottom: 18px; border-bottom: 4px solid transparent; border-image: var(--brand-grad) 1 }
.rel-logo { width: 140px; height: auto; border-radius: 8px }
@media (prefers-color-scheme: dark) { .rel-logo { background: #fff; padding: 6px 8px } }
.rel-capa h1 { font-size: 1.7rem }
.rel-muted { color: var(--muted); font-size: .9rem }
.rel-bloco { display: flex; flex-direction: column; gap: 14px }
.rel-bloco > h2 { font-size: 1.2rem; color: var(--accent) }
.rel-centro { text-align: center; align-items: center }
.rel-titulo { font-size: 2rem; color: var(--accent) }
.rel-barra { display: flex; width: 100%; height: 30px; border-radius: 15px; overflow: hidden }
.rel-barra > div { display: flex; align-items: center; justify-content: center }
.rel-barra i { width: 14px; height: 14px; border-radius: 50%; background: #fff }
.rel-fatores { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100% }
.rel-fatores > div { display: flex; flex-direction: column; align-items: center }
.rel-fatores b { font-size: 1.15rem; font-variant-numeric: tabular-nums } .rel-fatores span { font-size: 1.05rem } .rel-fatores small { font-weight: 700; font-size: .72rem }
.rel-sec h3 { font-size: 1rem; color: var(--accent); text-transform: uppercase; letter-spacing: .02em; margin-bottom: 4px }
.rel-alerta { background: var(--surface-2); border-radius: 8px; padding: 10px 14px; font-size: .9rem }
.rel-ind { display: flex; flex-direction: column; gap: 4px }
.rel-ind-top { display: flex; justify-content: space-between; gap: 10px } .rel-ind-top span { font-size: .75rem; font-weight: 700; color: var(--accent) }
.rel-ind p { color: var(--muted); font-size: .85rem }
.rel-track { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden } .rel-track > div { height: 100%; background: var(--accent); border-radius: 4px }
.rel-grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 28px }
.rel-comp { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: end }
.rel-comp-col { display: flex; flex-direction: column; align-items: center; gap: 4px }
.rel-comp-bars { display: flex; gap: 6px; align-items: flex-end; height: 140px; width: 100%; justify-content: center; border-bottom: 1px solid var(--line) }
.rel-comp-bars > div { width: 28px; border-radius: 4px 4px 0 0; min-height: 2px }
.rel-adapt { opacity: .4; background-image: repeating-linear-gradient(45deg, transparent 0 4px, rgba(255,255,255,.5) 4px 8px) }
.rel-leg { display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: var(--accent); vertical-align: -1px; margin-left: 8px }
.rel-pn { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: 8px }
.rel-pn-col { display: flex; flex-direction: column; align-items: center; gap: 6px }
.rel-pn-nums { display: flex; justify-content: space-between; width: 100%; font-weight: 700; font-size: .85rem; font-variant-numeric: tabular-nums }
.rel-pn-bar { display: flex; justify-content: center; width: 100%; height: 34px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: linear-gradient(var(--line), var(--line)) center / 1px 100% no-repeat }
.rel-pn-pos { margin-left: auto; border-radius: 17px 0 0 17px; min-width: 3px }
.rel-pn-neg { margin-right: auto; border-radius: 0 17px 17px 0; opacity: .5; min-width: 3px }
.rel-rodape { border-top: 1px solid var(--line); padding-top: 12px; font-size: .8rem }
@media (max-width: 560px) { .relatorio { padding: 18px } .rel-capa { flex-direction: column; align-items: flex-start } .rel-grade { grid-template-columns: minmax(0, 1fr) } .rel-fatores { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
@media print {
  body { background: #fff } .side, .no-print, #toast { display: none !important } .app { display: block }
  main .wrap { padding: 0; max-width: none } .relatorio { border: 0; padding: 0; max-width: none }
  .rel-bloco { break-inside: avoid-page } .rel-sec, .rel-ind { break-inside: avoid }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact }
  :root, :root:not([data-theme="light"]) { --bg: #fff; --surface: #fff; --surface-2: #ECEDF4; --ink: #1B1F45; --muted: #5E6185; --line: #DCDDEA;
    --accent: #27306A; --d: #D04545; --i: #D99A0B; --s: #3A9657; --c: #2E6CB5; color-scheme: light }
  .rel-logo { background: none; padding: 0 }
}
</style>
</head>
<body>

<div class="login" id="telaLogin" hidden>
  <form class="login-box" id="formLogin" novalidate>
    <div class="brand">
      <img class="brand-logo" src="logo.png" alt="AFLUX Estratégia Financeira Contábil" style="width:200px">
      <small>Gente &amp; Gestão · Plataforma de RH</small>
    </div>
    <div class="grad-bar"></div>
    <h1>Entrar</h1>
    <div class="field"><label for="l-email">E-mail</label><input type="email" id="l-email" autocomplete="username" required></div>
    <div class="field"><label for="l-senha">Senha</label><input type="password" id="l-senha" autocomplete="current-password" required></div>
    <p class="form-err" id="l-erro" hidden></p>
    <button type="submit" class="btn primary" id="l-btn">Entrar</button>
    <p class="small muted">Esqueceu a senha? Peça ao RH para redefinir o seu acesso.</p>
  </form>
</div>

<div class="login" id="telaAviso" hidden>
  <div class="login-box"><h1 id="avisoTitulo"></h1><p id="avisoTexto" class="muted"></p><button type="button" class="btn" data-action="sair" id="avisoSair">Sair</button></div>
</div>

<div class="app" id="telaApp" hidden>
  <aside class="side">
    <div class="brand">
      <img class="brand-logo" src="logo.png" alt="AFLUX Estratégia Financeira Contábil">
      <small>Gente &amp; Gestão</small>
      <div class="grad-bar"></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Seções">
      <button class="tab" data-action="go" data-view="painel"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Painel</button>
      <button class="tab" data-action="go" data-view="gestores"><svg viewBox="0 0 24 24"><circle cx="12" cy="6.5" r="3"/><path d="M6.5 15c.8-2.6 2.9-4 5.5-4s4.7 1.4 5.5 4"/><circle cx="5" cy="18" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="18" r="2"/></svg>Gestores</button>
      <button class="tab" data-action="go" data-view="colaboradores"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M17 14.5c2.3 0 4 1.4 4.6 4"/></svg>Colaboradores</button>
      <button class="tab" data-action="go" data-view="disc"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg>Testes DISC</button>
      <button class="tab" data-action="go" data-view="desempenho"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Desempenho</button>
      <button class="tab" data-action="go" data-view="feedbacks"><svg viewBox="0 0 24 24"><path d="M20 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/></svg>Feedbacks</button>
      <button class="tab" data-action="go" data-view="cargos" id="tabCargos" hidden><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg>Cargos e salários</button>
      <button class="tab" data-action="go" data-view="usuarios" id="tabUsuarios" hidden><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Usuários e acessos</button>
    </nav>
    <div class="side-foot">
      <div class="who"><b id="meNome"></b><span class="muted small" id="mePapel"></span></div>
      <div class="actions"><button type="button" class="btn sm" data-action="minha-senha">Minha senha</button><button type="button" class="btn sm" data-action="sair">Sair</button></div>
    </div>
  </aside>
  <main><div class="wrap" id="view"></div></main>
</div>

<dialog id="modal">
  <form id="modalForm" novalidate>
    <div class="m-head"><h2 id="mTitle"></h2><button type="button" class="btn sm" data-action="close-modal">Fechar</button></div>
    <div class="m-body" id="mBody"></div>
    <div class="m-foot" id="mFoot"></div>
  </form>
</dialog>
<div id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=2"></script>
<script src="relatorio-disc.js?v=2"></script>
<script>
const SETORES = { CONTABIL: "Contábil", FISCAL: "Fiscal", DP: "Departamento Pessoal", ATENDIMENTO: "Atendimento" };
const TABELAS = ["setores", "gestores", "colaboradores", "disc", "avaliacoes", "feedbacks"];
const S = { setores: [], gestores: [], colaboradores: [], disc: [], avaliacoes: [], feedbacks: [], perfis: [], disc_convites: [], disc_adjetivos: [], cargos_plano: [], remuneracao: [] };
let sb = null, me = null, carregado = false;
let view = "painel", perfilId = null;
const F = { setor: "", busca: "", status: "", fbColab: "", fbTipo: "", ciclo: "" };

const FACTORS = {
  D: { nome: "Dominância", resumo: "Direto, decidido e orientado a resultados. Gosta de desafios, autonomia e de ver as coisas acontecerem.",
       fortes: ["Decide rápido", "Foco em metas", "Encara mudanças"], atencao: ["Impaciência", "Pode atropelar pessoas", "Escuta pouco"],
       liderar: "Dê autonomia e metas claras, seja objetivo nas conversas e fale de resultados." },
  I: { nome: "Influência", resumo: "Comunicativo, entusiasmado e persuasivo. Energiza o time e cria conexões com facilidade.",
       fortes: ["Comunicação", "Motiva pessoas", "Criatividade"], atencao: ["Dispersão", "Pouco acompanhamento", "Promete demais"],
       liderar: "Reconheça em público, abra espaço para ideias e ajude a organizar prazos e combinados." },
  S: { nome: "Estabilidade", resumo: "Calmo, leal e colaborativo. Valoriza harmonia, rotina e relações de confiança.",
       fortes: ["Cooperação", "Constância", "Boa escuta"], atencao: ["Resiste a mudanças", "Dificuldade em dizer não", "Evita conflito"],
       liderar: "Antecipe mudanças com explicação, mantenha um ambiente seguro e valorize a dedicação." },
  C: { nome: "Conformidade", resumo: "Analítico, preciso e criterioso. Valoriza qualidade, método e regras claras.",
       fortes: ["Qualidade", "Análise", "Organização"], atencao: ["Perfeccionismo", "Demora para decidir", "Autocrítica alta"],
       liderar: "Dê informações e critérios claros, prazos realistas e respeite o método de trabalho." },
};
const COMPETENCIAS = [
  ["Entrega de resultados", "Cumpre metas e prazos com qualidade"],
  ["Conhecimento técnico", "Domina as ferramentas e processos da função"],
  ["Comunicação", "Expressa ideias com clareza e escuta os outros"],
  ["Trabalho em equipe", "Colabora e contribui para o resultado coletivo"],
  ["Proatividade", "Antecipa problemas e propõe soluções"],
  ["Adaptabilidade", "Lida bem com mudanças e novas demandas"],
  ["Liderança e influência", "Mobiliza pessoas e assume responsabilidades"],
];
// Análise de desempenho comportamental da AFLUX (ficha em papel), com conceitos E/S/R/I.
// Fica guardada em avaliacoes.notas.comportamental, junto das notas das competências.
const COMPORTAMENTAIS = [
  ["Ética", "O certo é certo mesmo quando ninguém está fazendo"],
  ["Empatia", "Ouvir o outro, se colocar no lugar da pessoa, respeitando sua história e as diferenças"],
  ["Simpatia", "Sorriso, palavras positivas"],
  ["Organização e limpeza", "Mesa, banheiro, cozinha"],
  ["Humildade", "Compartilhar conhecimento, ser solícito, pedir ajuda depois de pesquisar"],
  ["Buscar conhecimento constantemente", ""],
  ["Errar pouco, corrigir rápido", "Tanto para erros internos quanto de clientes"],
  ["Eficácia", "Atender o cliente de forma eficaz, ágil e solucionando seus problemas da melhor forma"],
  ["Buscar e usar ferramentas tecnológicas", "Desburocratizar, simplificar e agilizar o processo"],
  ["Personalização", "Atender o cliente de forma particular para que ele se sinta único e especial"],
  ["Iniciativa", "Fazer o que tem de ser feito sem esperar ordens"],
  ["Sociabilidade", "Facilidade para trabalhar em equipe"],
  ["Eficiência", "Realizações de atribuições dentro dos prazos e critérios estabelecidos"],
  ["Liderança", "Capacidade de conduzir os outros a objetivos comuns"],
  ["Senso de urgência", "Reavaliar as prioridades conforme demandas e ligar para o cliente quando necessário"],
];
// Escala única das duas análises (competências e comportamental)
const CONCEITOS = { 1: "Muito abaixo do esperado", 2: "Abaixo do esperado", 3: "Atende ao esperado", 4: "Acima do esperado", 5: "Supera as expectativas" };
const CONCEITO_CLS = { 1: "bad", 2: "warn", 3: "plain", 4: "ok", 5: "ok" };
const CONCEITO_COR = { 1: "var(--bad)", 2: "var(--warn)", 3: "var(--muted)", 4: "var(--c)", 5: "var(--good)" };
const legendaEscala = () => `<p class="small muted">${Object.entries(CONCEITOS).map(([k, t]) => `${k} – ${t}`).join(" · ")}</p>`;
// a análise comportamental já foi guardada com E/S/R/I; converte essas avaliações para a escala de 1 a 5
const notaComport = v => ({ E: 5, S: 4, R: 2, I: 1 })[v] ?? (Number(v) || null);
// Nota final de 0 a 10: média geral (metade competências, metade comportamental, de 1 a 5) vezes 2.
// O conceito final é o nível da escala mais próximo da média geral.
// Avaliações sem a parte comportamental usam só as competências.
function notaFinal(a) {
  if (!a) return null;
  const vals = Object.values(a.notas?.comportamental || {}).map(notaComport).filter(Boolean);
  const comport = vals.length ? vals.reduce((s, x) => s + x, 0) / vals.length : null;
  const geral = comport == null ? a.media : (a.media + comport) / 2;
  return { nota: Math.round(geral * 20) / 10, conceito: Math.min(5, Math.max(1, Math.round(geral))), comp: a.media, comport, geral };
}
const notaFinalChip = a => { const f = notaFinal(a); return f ? `<span class="score">${fmtNota(f.nota)}</span> <span class="pill ${CONCEITO_CLS[f.conceito]}">${CONCEITOS[f.conceito]}</span>` : `<span class="muted">—</span>`; };
const TIPOS_FB = ["Reconhecimento", "Construtivo", "Reunião 1:1", "Alinhamento de metas"];
const STATUS = ["Ativo", "Férias", "Afastado", "Desligado"];
const CONTRATOS = ["CLT", "PJ", "Estágio", "Temporário", "Aprendiz"];

/* ---------- utilidades ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hoje = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const fmtData = d => d ? d.split("-").reverse().join("/") : "—";
const fmtNota = n => Number(n).toFixed(1).replace(".", ",");
const byNome = (a, b) => (a.nome || "").localeCompare(b.nome || "", "pt-BR");
const byDataDesc = (a, b) => (b.data || "").localeCompare(a.data || "") || (b.criado_em || "").localeCompare(a.criado_em || "");
const isAdmin = () => me?.papel === "admin";
const meus = r => isAdmin() || r.criado_por === me.id;
const colab = id => S.colaboradores.find(c => c.id === id);
const nomeDe = id => colab(id)?.nome || "Colaborador";
const gestor = id => S.gestores.find(g => g.id === id);
const liderados = gid => S.colaboradores.filter(c => c.lider_id === gid && c.status !== "Desligado").sort(byNome);
const subGestores = gid => S.gestores.filter(g => g.superior_id === gid).sort(byNome);
// Gestores que estão abaixo de gid em qualquer nível (para não deixar a hierarquia virar um ciclo)
const abaixoDe = gid => { const s = new Set(); const ir = id => subGestores(id).forEach(g => { if (!s.has(g.id)) { s.add(g.id); ir(g.id); } }); ir(gid); return s; };
const iniciais = n => (n || "?").trim().split(/\s+/).filter(Boolean).map(p => p[0]).slice(0, 2).join("").toUpperCase();
const hue = s => { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; };
const avatar = (c, cls = "") => `<span class="av ${cls}" style="--h:${hue(c?.id || c?.nome)}" aria-hidden="true">${esc(iniciais(c?.nome))}</span>`;
const setoresVisiveis = () => isAdmin() ? Object.keys(SETORES) : Object.keys(SETORES).filter(k => (me.setores || []).includes(k));
// colaboradores dentro do filtro de setor escolhido no topo
const pessoas = () => S.colaboradores.filter(c => !F.setor || c.setor === F.setor);
const noEscopo = cid => { const c = colab(cid); return !!c && (!F.setor || c.setor === F.setor); };
const ultimoDisc = cid => S.disc.filter(d => d.colaborador_id === cid).sort(byDataDesc)[0];
const ultimaAval = cid => S.avaliacoes.filter(a => a.colaborador_id === cid).sort(byDataDesc)[0];
const ativos = () => pessoas().filter(c => c.status !== "Desligado");
const statusPill = s => `<span class="pill ${s === "Ativo" ? "ok" : s === "Desligado" ? "bad" : "warn"}">${esc(s || "Ativo")}</span>`;
const discChip = d => d ? `<span class="disc-chip" title="Perfil ${esc(d.perfil)}">${d.perfil.split("").map(f => `<span class="f-${f}">${f}</span>`).join("")}</span>` : `<span class="muted small">Sem teste</span>`;
const dots = n => `<span class="dots">${[1,2,3,4,5].map(i => `<i class="${i <= Math.round(n) ? "on" : ""}"></i>`).join("")}</span>`;
const colabOptions = (sel, incluirVazio = true, excluir) => (incluirVazio ? `<option value="">Selecione…</option>` : "") +
  [...pessoas()].sort(byNome).filter(c => c.id !== excluir).map(c => `<option value="${esc(c.id)}" ${c.id === sel ? "selected" : ""}>${esc(c.nome)}</option>`).join("");
const vazioParaNull = o => { const r = {}; for (const [k, v] of Object.entries(o)) r[k] = v === "" ? null : v; return r; };

// fator principal e, se tiver 25% ou mais do total, o segundo (mesma regra do relatório)
const perfilDe = v => perfilPorPartes(v);
function toast(msg, err = false) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = err ? "err" : ""; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, err ? 6000 : 2600);
}
function tela(nome) { ["telaLogin", "telaAviso", "telaApp"].forEach(id => document.getElementById(id).hidden = id !== nome); }
function aviso(titulo, texto, comSair = true) {
  document.getElementById("avisoTitulo").textContent = titulo;
  document.getElementById("avisoTexto").textContent = texto;
  document.getElementById("avisoSair").hidden = !comSair;
  tela("telaAviso");
}

/* ---------- dados ---------- */
// O banco usa d/i/s/c em minúsculas; a tela usa D/I/S/C
const num = x => x == null ? null : Number(x);
const doBanco = (t, r) => t === "disc" ? { ...r, D: r.d, I: r.i, S: r.s, C: r.c } : t === "avaliacoes" ? { ...r, media: Number(r.media) }
  : t === "cargos_plano" ? { ...r, salario_min: num(r.salario_min), salario_max: num(r.salario_max) }
  : t === "remuneracao" ? { ...r, salario_atual: num(r.salario_atual) } : r;
function erroMsg(e) {
  if (e?.code === "42501" || /row-level security/i.test(e?.message || "")) return "Você não tem permissão para fazer isso.";
  if (e?.code === "23503") return "Esse registro está ligado a outro e não pode ser alterado assim.";
  return "Não foi possível salvar: " + (e?.message || "erro desconhecido") + ".";
}
async function carregar(tabelas = TABELAS) {
  const lista = tabelas !== TABELAS ? tabelas : [...tabelas, "disc_adjetivos", ...(isAdmin() ? ["perfis", "disc_convites", "cargos_plano", "remuneracao"] : [])];
  const res = await Promise.all(lista.map(t => sb.from(t).select("*")));
  res.forEach((r, i) => {
    // a lista de adjetivos só existe depois de rodar o disc-adjetivos.sql; sem ela o relatório só não mostra esse gráfico
    if (r.error) return lista[i] === "disc_adjetivos" ? null : toast("Não foi possível carregar " + lista[i] + ": " + r.error.message, true);
    S[lista[i]] = r.data.map(x => doBanco(lista[i], x));
  });
  carregado = true; render();
}
async function save(tabela, id, dados) {
  const payload = vazioParaNull(dados);
  const { error } = id ? await sb.from(tabela).update(payload).eq("id", id) : await sb.from(tabela).insert(payload);
  if (error) { toast(erroMsg(error), true); return false; }
  await carregar([tabela]);
  return true;
}
async function remove(tabela, id) {
  const { error } = await sb.from(tabela).delete().eq("id", id);
  if (error) { toast(erroMsg(error), true); return false; }
  await carregar(TABELAS);
  return true;
}

/* ---------- login ---------- */
async function iniciar() {
  if (!window.supabase || !window.CONFIG || /COLE_AQUI/.test(CONFIG.SUPABASE_URL + CONFIG.SUPABASE_ANON_KEY))
    return aviso("Configuração pendente", "Preencha o arquivo config.js com a Project URL e a chave anon public do Supabase. O passo a passo está no arquivo LEIA-ME.", false);
  sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT") { me = null; carregado = false; tela("telaLogin"); } });
  const { data: { session } } = await sb.auth.getSession();
  if (session) entrar(session.user); else tela("telaLogin");
}
async function entrar(user) {
  const { data: p, error } = await sb.from("perfis").select("*").eq("id", user.id).maybeSingle();
  if (error) return aviso("Não foi possível entrar", "Erro ao ler seu perfil: " + error.message);
  if (!p || !p.ativo) return aviso("Acesso ainda não liberado", "Seu login existe, mas o RH ainda não liberou o seu acesso. Fale com a administradora da plataforma.");
  if (p.papel !== "admin" && !(p.setores || []).length) return aviso("Nenhum setor liberado", "Seu acesso está ativo, mas nenhum setor foi marcado para você. Peça ao RH para liberar os setores da sua equipe.");
  me = p;
  document.getElementById("meNome").textContent = p.nome || p.email;
  document.getElementById("mePapel").textContent = isAdmin() ? "Administradora · acesso total" : "Gestor · " + setoresVisiveis().map(k => SETORES[k]).join(", ");
  document.getElementById("tabUsuarios").hidden = !isAdmin();
  document.getElementById("tabCargos").hidden = !isAdmin();
  const inicial = (location.hash || "").slice(1);
  view = VIEWS[inicial] && inicial !== "perfil" && inicial !== "relatorio" && (!["usuarios", "cargos"].includes(inicial) || isAdmin()) ? inicial : "painel";
  F.setor = setoresVisiveis().length === 1 ? setoresVisiveis()[0] : "";
  tela("telaApp"); render();
  carregar();
}
document.getElementById("formLogin").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("l-btn"), err = document.getElementById("l-erro");
  const email = document.getElementById("l-email").value.trim(), password = document.getElementById("l-senha").value;
  err.hidden = true;
  if (!email || !password) { err.textContent = "Informe e-mail e senha."; err.hidden = false; return; }
  btn.disabled = true;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false;
  if (error) { err.textContent = /invalid/i.test(error.message) ? "E-mail ou senha incorretos." : /confirm/i.test(error.message) ? "Este e-mail ainda não foi confirmado. Fale com o RH." : error.message; err.hidden = false; return; }
  document.getElementById("l-senha").value = "";
  entrar(data.user);
});

/* ---------- modal ---------- */
const modal = document.getElementById("modal"), mForm = document.getElementById("modalForm");
let onSubmit = null;
function openModal({ title, body, submit = "Salvar", danger = false, handler, wide = false, cancelar = "Cancelar" }) {
  document.getElementById("mTitle").textContent = title;
  document.getElementById("mBody").innerHTML = body;
  document.getElementById("mFoot").innerHTML = `<button type="button" class="btn" data-action="close-modal">${esc(cancelar)}</button>${submit ? `<button type="submit" class="btn ${danger ? "danger solid" : "primary"}">${esc(submit)}</button>` : ""}`;
  modal.style.width = wide ? "min(860px, calc(100vw - 32px))" : "";
  onSubmit = handler;
  if (!modal.open) modal.showModal();
  mForm.querySelector("input:not([type=hidden]):not([readonly]), select, textarea")?.focus();
}
function closeModal() { modal.close(); onSubmit = null; }
mForm.addEventListener("submit", async e => {
  e.preventDefault();
  if (!onSubmit) return;
  const btn = mForm.querySelector("[type=submit]"); btn.disabled = true;
  const ok = await onSubmit(new FormData(mForm), mForm);
  btn.disabled = false;
  if (ok !== false) closeModal();
});
function formErro(msg) {
  let el = mForm.querySelector(".form-err");
  if (!el) { el = document.createElement("p"); el.className = "form-err"; document.getElementById("mBody").prepend(el); }
  el.textContent = msg; el.scrollIntoView({ block: "nearest" });
  return false;
}
function confirmar(titulo, html, botao, acao) {
  openModal({ title: titulo, body: html, submit: botao, danger: true, handler: async () => (await acao()) ? undefined : false });
}

function formLiderados(g) {
  const atuais = new Set(liderados(g.id).map(c => c.id));
  const subsAtuais = new Set(subGestores(g.id).map(x => x.id));
  // Quem está acima de g não pode virar liderado dele
  const acima = new Set(); for (let p = gestor(g.superior_id); p && !acima.has(p.id); p = gestor(p.superior_id)) acima.add(p.id);
  const outrosGestores = [...S.gestores].filter(x => x.id !== g.id && !acima.has(x.id)).sort(byNome);
  const grupoGestores = outrosGestores.length ? `<div><p class="lbl" style="margin-bottom:6px">Gestores</p><div class="checks" style="flex-direction:column;gap:6px">
      ${outrosGestores.map(x => { const outro = x.superior_id && x.superior_id !== g.id ? gestor(x.superior_id) : null;
        return `<label><input type="checkbox" name="subgestores" value="${esc(x.id)}" ${subsAtuais.has(x.id) ? "checked" : ""}> ${esc(x.nome)} <span class="muted small">· ${esc(x.cargo || "Gestor")}${outro ? ` · hoje com ${esc(outro.nome)}` : ""}</span></label>`; }).join("")}
    </div></div>` : "";
  const grupos = grupoGestores + Object.entries(SETORES).map(([k, n]) => {
    const pessoasSetor = S.colaboradores.filter(c => c.setor === k && c.status !== "Desligado").sort(byNome);
    if (!pessoasSetor.length) return "";
    return `<div><p class="lbl" style="margin-bottom:6px">${n}</p><div class="checks" style="flex-direction:column;gap:6px">
      ${pessoasSetor.map(c => { const outro = c.lider_id && c.lider_id !== g.id ? gestor(c.lider_id) : null;
        return `<label><input type="checkbox" name="liderados" value="${esc(c.id)}" ${atuais.has(c.id) ? "checked" : ""}> ${esc(c.nome)} <span class="muted small">· ${esc(c.cargo)}${outro ? ` · hoje com ${esc(outro.nome)}` : ""}</span></label>`; }).join("")}
    </div></div>`;
  }).join("");
  openModal({
    title: "Liderados diretos · " + g.nome,
    body: grupos ? `<p class="small muted">Marque as pessoas que respondem diretamente a ${esc(g.nome)}. Quem já tem outro gestor passa para ${esc(g.nome)} ao ser marcado.</p>${grupos}`
      : emptyState("Nenhum colaborador cadastrado", "Cadastre os colaboradores primeiro."),
    handler: async fd => {
      const sel = new Set(fd.getAll("liderados"));
      const add = [...sel].filter(id => !atuais.has(id)), rem = [...atuais].filter(id => !sel.has(id));
      for (const [ids, valor] of [[add, g.id], [rem, null]]) {
        if (!ids.length) continue;
        const { error } = await sb.from("colaboradores").update({ lider_id: valor }).in("id", ids);
        if (error) { toast(erroMsg(error), true); return false; }
      }
      const selG = new Set(fd.getAll("subgestores"));
      const addG = [...selG].filter(id => !subsAtuais.has(id)), remG = [...subsAtuais].filter(id => !selG.has(id));
      for (const [ids, valor] of [[addG, g.id], [remG, null]]) {
        if (!ids.length) continue;
        const { error } = await sb.from("gestores").update({ superior_id: valor }).in("id", ids);
        if (error) { toast(erroMsg(error), true); return false; }
      }
      await carregar(["colaboradores", "gestores"]);
      toast(`${sel.size + selG.size} liderado(s) de ${g.nome}`);
    }
  });
}

  openModal({
    title: "Aplicar teste DISC", submit: "Gerar link",

/* ---------- cargos e salários ---------- */
const brl = v => v == null ? "—" : v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const valorCampo = v => v == null ? "" : v.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
// aceita "2.500,00", "2500,5" ou "2500.50"
function lerValor(s) {
  s = String(s || "").replace(/[^\d,.-]/g, "");
  if (!s) return null;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  const n = Number(s);
  return Number.isFinite(n) ? Math.round(n * 100) / 100 : NaN;
}
const cargoPlano = id => S.cargos_plano.find(c => c.id === id);
const remunDe = cid => S.remuneracao.find(r => r.colaborador_id === cid);
const faixaTxt = cg => !cg || cg.salario_min == null ? "Sem valor definido"
  : cg.salario_max == null || cg.salario_max === cg.salario_min ? brl(cg.salario_min) : `${brl(cg.salario_min)} a ${brl(cg.salario_max)}`;
// Compara o salário atual com a faixa do cargo: diferença negativa = falta para chegar ao piso
function enquadramento(r) {
  const cg = r && cargoPlano(r.cargo_id);
  if (!cg) return { sit: "sem-cargo", txt: "Sem cargo no plano", cls: "plain" };
  if (r.salario_atual == null) return { sit: "sem-salario", txt: "Salário não informado", cls: "plain" };
  if (cg.salario_min == null) return { sit: "sem-faixa", txt: "Cargo sem valor", cls: "plain" };
  const teto = cg.salario_max ?? cg.salario_min;
  if (r.salario_atual < cg.salario_min) return { sit: "abaixo", txt: "Abaixo do plano", cls: "bad", dif: r.salario_atual - cg.salario_min };
  if (r.salario_atual > teto) return { sit: "acima", txt: "Acima do plano", cls: "warn", dif: r.salario_atual - teto };
  return { sit: "dentro", txt: "Dentro do plano", cls: "ok", dif: 0 };
}

      <div class="field"><label for="cg-max">Teto da faixa</label><input type="text" inputmode="decimal" id="cg-max" name="salario_max" value="${valorCampo(cg.salario_max)}" placeholder="Deixe em branco se for valor único"></div>
      <div class="field full"><label for="cg-desc">Descrição das atividades</label><textarea id="cg-desc" name="descricao">${esc(cg.descricao)}</textarea></div>
      <div class="field full"><label for="cg-req">Requisitos para o cargo</label><textarea id="cg-req" name="requisitos" placeholder="Formação, experiência, conhecimentos…">${esc(cg.requisitos)}</textarea></div>
    </div>`,
    handler: async fd => {
      const o = Object.fromEntries(fd);
      o.nome = o.nome.trim();
      if (!o.nome) return formErro("Informe o nome do cargo.");
      o.salario_min = lerValor(o.salario_min); o.salario_max = lerValor(o.salario_max);
      if (Number.isNaN(o.salario_min) || Number.isNaN(o.salario_max)) return formErro("Confira os valores. Use o formato 2.500,00.");
      if (o.salario_min != null && o.salario_max != null && o.salario_max < o.salario_min) return formErro("O teto não pode ser menor que o piso.");
      if (!await save("cargos_plano", cg.id, o)) return false;
      toast(cg.id ? "Cargo atualizado" : "Cargo incluído no plano");
    }
  });
}

function formRemuneracao(cid) {
  const c = colab(cid), r = remunDe(cid) || {};
  const cargos = [...S.cargos_plano].sort((a, b) => byNome(a, b) || (a.nivel || "").localeCompare(b.nivel || ""));

      <div class="field full"><label for="rm-cargo">Cargo no plano</label><select id="rm-cargo" name="cargo_id"><option value="">Sem cargo no plano</option>${cargos.map(cg => `<option value="${esc(cg.id)}" ${cg.id === r.cargo_id ? "selected" : ""}>${esc(cg.nome)}${cg.nivel ? " · " + esc(cg.nivel) : ""} (${esc(faixaTxt(cg))})</option>`).join("")}</select>
        <small class="muted">Cargo no cadastro: ${esc(c.cargo)}</small></div>
      <div class="field"><label for="rm-sal">Salário atual</label><input type="text" inputmode="decimal" id="rm-sal" name="salario_atual" value="${valorCampo(r.salario_atual)}" placeholder="Ex.: 2.350,00"></div>
      <div class="field full"><label for="rm-obs">Observações</label><textarea id="rm-obs" name="observacoes" placeholder="Ex.: próxima revisão em março">${esc(r.observacoes)}</textarea></div>

    handler: async fd => {
      const salario = lerValor(fd.get("salario_atual"));

      const { error } = await sb.from("remuneracao").upsert({ colaborador_id: cid, cargo_id: fd.get("cargo_id") || null, salario_atual: salario,
        observacoes: fd.get("observacoes") || null, atualizado_em: new Date().toISOString() }, { onConflict: "colaborador_id" });
      if (error) { toast(erroMsg(error), true); return false; }

function formUsuario(u) {
  const novo = !u;
  u = u || { papel: "gestor", setores: [], ativo: true };
  const proprio = u.id === me.id;
  openModal({
    title: novo ? "Novo usuário" : "Editar acesso · " + (u.nome || u.email),
    body: `<div class="form-grid">
      <div class="field full"><label class="req" for="u-nome">Nome</label><input type="text" id="u-nome" name="nome" value="${esc(u.nome)}"></div>
      <div class="field"><label class="req" for="u-email">E-mail de login</label><input type="email" id="u-email" name="email" value="${esc(u.email)}" ${novo ? "" : "readonly"}></div>
      ${novo ? `<div class="field"><label class="req" for="u-senha">Senha provisória</label><input type="text" id="u-senha" name="senha" autocomplete="off" placeholder="Mínimo de 8 caracteres"></div>` : ""}
      <div class="field"><label for="u-papel">Perfil</label><select id="u-papel" name="papel" ${proprio ? "disabled" : ""}><option value="gestor" ${u.papel === "gestor" ? "selected" : ""}>Gestor</option><option value="admin" ${u.papel === "admin" ? "selected" : ""}>Administrador (acesso total)</option></select></div>
      ${novo ? "" : `<div class="field"><label for="u-ativo">Situação</label><select id="u-ativo" name="ativo" ${proprio ? "disabled" : ""}><option value="1" ${u.ativo ? "selected" : ""}>Acesso liberado</option><option value="0" ${!u.ativo ? "selected" : ""}>Acesso bloqueado</option></select></div>`}
      <div class="field full"><span class="lbl">Setores que pode visualizar</span>
        <div class="checks">${Object.entries(SETORES).map(([k, n]) => `<label><input type="checkbox" name="setores" value="${k}" ${(u.setores || []).includes(k) ? "checked" : ""}> ${n}</label>`).join("")}</div>
        <small class="muted">Administradores veem todos os setores, independentemente desta marcação.</small></div>
    </div>
    <div class="small muted"><b>O que um gestor pode fazer:</b> ver os colaboradores e os resultados DISC dos setores marcados, registrar avaliações e feedbacks dessas pessoas e editar o que ele mesmo registrou. Não pode cadastrar colaboradores nem aplicar ou lançar testes DISC.</div>
    ${novo ? `<p class="small muted">Envie o e-mail e a senha provisória ao gestor. Ele pode trocar a senha em “Minha senha” depois de entrar.</p>` : ""}`,
    handler: async fd => {
      const nome = (fd.get("nome") || "").trim(), setores = fd.getAll("setores");
      const papel = proprio ? u.papel : fd.get("papel");
      if (!nome) return formErro("Informe o nome.");
      if (papel === "gestor" && !setores.length) return formErro("Marque ao menos um setor para o gestor.");
      let id = u.id;
      if (novo) {
        const email = (fd.get("email") || "").trim(), senha = fd.get("senha") || "";
        if (!email) return formErro("Informe o e-mail de login.");
        if (senha.length < 8) return formErro("A senha provisória precisa ter ao menos 8 caracteres.");
        // cliente separado para criar o login sem encerrar a sessão da administradora
        const tmp = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false, storageKey: "gg-cadastro" } });
        const { data, error } = await tmp.auth.signUp({ email, password: senha, options: { data: { nome } } });
        if (error) return formErro(/registered|already/i.test(error.message) ? "Já existe um login com esse e-mail." : /password/i.test(error.message) ? "Senha fraca: use letras e números, com ao menos 8 caracteres." : "Não foi possível criar o login: " + error.message);
        if (!data.user || (data.user.identities && !data.user.identities.length)) return formErro("Já existe um login com esse e-mail.");
        id = data.user.id;
      }
      const dados = { nome, setores, papel, ativo: novo ? true : proprio ? true : fd.get("ativo") === "1" };
      const { data: up, error } = await sb.from("perfis").update(dados).eq("id", id).select();
      if (error || !up?.length) { toast(error ? erroMsg(error) : "O login foi criado, mas o perfil não foi encontrado. Confira se o schema.sql foi rodado.", true); return false; }
      await carregar(["perfis"]);
      toast(novo ? "Usuário criado. Envie o login e a senha ao gestor." : "Acesso atualizado");
    }
  });
}

function formMinhaSenha() {
  openModal({
    title: "Alterar minha senha", submit: "Alterar senha",
    body: `<div class="form-grid">
      <div class="field full"><label class="req" for="p-nova">Nova senha</label><input type="password" id="p-nova" name="nova" autocomplete="new-password"></div>
      <div class="field full"><label class="req" for="p-conf">Repita a nova senha</label><input type="password" id="p-conf" name="conf" autocomplete="new-password"></div>
    </div>`,
    handler: async fd => {
      const n = fd.get("nova") || "";
      if (n.length < 8) return formErro("Use ao menos 8 caracteres.");
      if (n !== fd.get("conf")) return formErro("As duas senhas não são iguais.");
      const { error } = await sb.auth.updateUser({ password: n });
      if (error) return formErro("Não foi possível alterar: " + error.message);
      toast("Senha alterada");
    }
  });
}

function discBars(d) {
  return `<div class="bars">${"DISC".split("").map(f => `<div class="bar-row"><span><b class="t-${f}">${f}</b> ${FACTORS[f].nome}</span>

// Teste por adjetivos: além do perfil natural ("como sou"), mostra o adaptado ("como esperam que eu seja")
function discAdaptado(d) {
  const r = d.respostas;
  if (r?.formato !== "adjetivos" || !r.adaptado) return "";

    ${discBars(a)}

function seletorSetor() {
  const vs = setoresVisiveis();

}

const VIEWS = {
